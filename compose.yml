services:
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_ORIGINS=*
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama_api_data:/root/.ollama
    ports:
      - ${OLLAMA_PORT:-11434}:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull ${OLLAMA_MODEL:-qwen-3.5:2b} &&
      echo '' &&
      echo '==========================================================' &&
      echo '  Ollama is ready. Installed models (works right away):' &&
      echo '  http://localhost:${OLLAMA_PORT:-11434}/api/tags' &&
      echo '' &&
      echo '  Models loaded in memory (empty until first request):' &&
      echo '  http://localhost:${OLLAMA_PORT:-11434}/api/ps' &&
      echo '==========================================================' &&
      echo '' &&
      wait
      "

volumes:
  ollama_api_data:
